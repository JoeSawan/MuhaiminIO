[package]
name = "quink_app"
version = "0.1.0"
edition = "2021"
authors = ["Mahmoud Al-Sawan <joe5sawan@gmail.com>"]
description = "QUINK APP - Cross-platform GUI to control microcontrollers via serial"
license = "UNLICENSED" 
repository = "https://github.com/MahmoudAlSawan/quink_app"  # ضع الرابط الحقيقي لاحقًا

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }       # لتنفيذ المهام غير المتزامنة
serialport = "4.8.1"                                      # للتعامل مع منفذ السيريال
crossbeam-channel = "0.5.15"                              # للتواصل بين الـ Threads
spin = "0.10.0"                                           # قفل خفيف لخيوط المعالجة
byteorder = "1.5.0"                                       # لتحويل البايتات إلى أنواع عددية
hex = "0.4.3"                                             # تحويل القيم إلى/من hex
slint = "1.14.1"                                          # واجهة المستخدم
serde = { version = "1.0", features = ["derive"] }        # التسلسل والإلغاء
serde_json = "1.0"                                        # JSON support

[build-dependencies]
slint-build = "1.11.0"                                    # توليد كود Rust من ملفات .slint

[profile.release]
opt-level = "z"                                           # تصغير حجم الملف التنفيذي
lto = true
codegen-units = 1
